<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

{%- include head.html -%}

<body class="{% if site.darkmode == true and site.darkmode != 'never' %}dark{% endif %}">

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      <article class="post" style="max-width: 760px; margin: 2rem auto; padding: 0 1rem;">
        {%- if page.title -%}
          <header class="post-header" style="margin-bottom: 1.5rem;">
            <h1 class="post-title" style="margin: 0;">{{ page.title }}</h1>
          </header>
        {%- endif -%}
        <div class="post-content">
          {{ content }}
        </div>
      </article>
    </div>
  </main>

  {%- include footer.html -%}
  {% if site.darkmode == false %}
    <script src="{{ '/assets/js/index.js' | relative_url }}"></script>
  {% endif %}

</body>

</html>
